[project]
name = "astaire"
version = "0.6.1"
description = "Hybrid memory palace — structured knowledge store for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.12.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
astaire = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "characterisation: documents current behaviour of legacy code before Phase 10 refactors",
]

[tool.mutmut]
paths_to_mutate = ["src/domain/claims/models.py"]
tests_dir = ["tests/test_domain_claims.py"]
pytest_add_cli_args = ["-q"]
do_not_mutate = ["tests/*"]
also_copy = [
    "src/db.py",
    "src/domain/__init__.py",
    "src/domain/claims/__init__.py",
    "src/domain/claims/ports.py",
]
